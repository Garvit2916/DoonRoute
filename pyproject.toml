[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doonroute"
version = "0.1.0"
description = "Shortest-distance waypoint routing on Dehradun's real road network with a from-scratch Dijkstra implementation"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "networkx==3.6.1",
    "numpy==2.4.6",
    "matplotlib==3.11.2",
    "osmnx==2.1.1",
    "osmium==4.3.2",
    "requests==2.32.5",
    "Cython==3.3.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["python_dijkstra", "routing", "benchmark", "cpp_dijkstra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
